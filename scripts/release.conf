# How homebrew-tap's scripts/release publishes timetattle; its --help lists the keys.
formula=timetattle
name=Timetattle
version_file=cmd/timetattle/version.go
version_line=const version = "%s"
check=go vet ./... && go test ./...
bottle=yes
# The keyword, not the certificate's name: the confidentiality gate forbids that here.
sign=developer-id
notary_profile=woodcase-notary
